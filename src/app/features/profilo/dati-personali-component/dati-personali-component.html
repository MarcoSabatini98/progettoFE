<h2>{{ 'profilo.dati' | transloco }}</h2>

<form [formGroup]="modulo" (ngSubmit)="salva()" novalidate>
  <div class="campi-coppia">
    <app-campo
      [etichetta]="'registrazione.nome' | transloco"
      [errore]="errori.campo(modulo.controls.nome)"
    >
      <input
        type="text"
        formControlName="nome"
        autocomplete="given-name"
        [maxLength]="lunghezza.nome"
        required
      />
    </app-campo>

    <app-campo
      [etichetta]="'registrazione.cognome' | transloco"
      [errore]="errori.campo(modulo.controls.cognome)"
    >
      <input
        type="text"
        formControlName="cognome"
        autocomplete="family-name"
        [maxLength]="lunghezza.cognome"
        required
      />
    </app-campo>
  </div>

  <div class="campi-coppia">
    <app-campo
      [etichetta]="'registrazione.telefono' | transloco"
      [aiuto]="'registrazione.facoltativo' | transloco"
      [errore]="errori.campo(modulo.controls.telefono)"
    >
      <input
        type="tel"
        formControlName="telefono"
        autocomplete="tel"
        [maxLength]="lunghezza.telefono"
      />
    </app-campo>

    <app-campo
      [etichetta]="'profilo.lingua' | transloco"
      [aiuto]="'profilo.linguaAiuto' | transloco"
    >
      <select formControlName="lingua">
        @for (codice of lingua.disponibili(); track codice) {
          <option [value]="codice" [lang]="codice">{{ nomiLingue[codice] }}</option>
        }
      </select>
    </app-campo>
  </div>

  @if (errore()) {
    <p class="esito esito-errore" role="alert">{{ errore() }}</p>
  }

  <div class="azioni">
    <button
      class="pulsante pulsante-primario"
      type="submit"
      [disabled]="inCorso() || modulo.pristine"
    >
      {{ 'profilo.salva' | transloco }}
    </button>
  </div>
</form>
