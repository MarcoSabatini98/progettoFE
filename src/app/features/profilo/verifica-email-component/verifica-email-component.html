<h2>{{ 'verifica.titolo' | transloco }}</h2>
<p class="descrizione">{{ 'verifica.descrizione' | transloco: { cifre } }}</p>

<form [formGroup]="modulo" (ngSubmit)="verifica()" novalidate>
  <app-campo
    [etichetta]="'verifica.codice' | transloco"
    [errore]="errori.campo(modulo.controls.codice)"
  >
    <input
      class="codice"
      type="text"
      formControlName="codice"
      inputmode="numeric"
      autocomplete="one-time-code"
      [maxLength]="cifre"
      required
    />
  </app-campo>

  @if (errore()) {
    <p class="esito esito-errore" role="alert">{{ errore() }}</p>
  }
  @if (inviato()) {
    <p class="esito esito-ok" role="status">{{ 'verifica.inviato' | transloco }}</p>
  }

  <div class="azioni">
    <button class="pulsante pulsante-primario" type="submit" [disabled]="inCorso()">
      {{ 'verifica.conferma' | transloco }}
    </button>
    <button
      class="pulsante pulsante-fantasma"
      type="button"
      [disabled]="inCorso()"
      (click)="richiediCodice()"
    >
      {{ 'verifica.nuovoCodice' | transloco }}
    </button>
  </div>
</form>
