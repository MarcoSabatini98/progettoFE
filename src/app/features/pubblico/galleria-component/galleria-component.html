<div #striscia class="striscia" role="region" tabindex="0" [attr.aria-label]="etichetta()">
  @for (foto of media(); track foto.id; let prima = $first) {
    <img
      [src]="foto.percorso | media"
      [alt]="foto.testo_alternativo"
      [attr.width]="foto.larghezza"
      [attr.height]="foto.altezza"
      [attr.loading]="prima ? null : 'lazy'"
    />
  }
</div>

@if (media().length > 1) {
  <div class="comandi">
    <button
      type="button"
      class="pulsante pulsante-secondario pulsante-icona"
      [attr.aria-label]="'galleria.precedente' | transloco"
      (click)="scorri(striscia, -1)"
    >
      <app-icona nome="chevron_left" />
    </button>
    <button
      type="button"
      class="pulsante pulsante-secondario pulsante-icona"
      [attr.aria-label]="'galleria.successiva' | transloco"
      (click)="scorri(striscia, 1)"
    >
      <app-icona nome="chevron_right" />
    </button>
  </div>
}
