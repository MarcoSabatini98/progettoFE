@for (sezione of sezioni(); track sezione.id) {
  <article class="blocco">
    @if (sezione.media?.[0]; as foto) {
      <img
        class="immagine"
        [src]="foto.percorso | media"
        [alt]="foto.testo_alternativo"
        loading="lazy"
      />
    }
    <div class="testo">
      <h2 class="sezione-titolo">{{ sezione.titolo }}</h2>
      <p>{{ sezione.testo }}</p>
    </div>
  </article>
}
