<h2 class="titolo-scheda">{{ 'gestionale.fatture.nota.titolo' | transloco }}</h2>
<p class="tenue">{{ 'gestionale.fatture.nota.aiuto' | transloco }}</p>

<app-campo
  [etichetta]="'gestionale.fatture.nota.motivo' | transloco"
  [errore]="errori.campo(motivo)"
>
  <input [formControl]="motivo" [maxLength]="lunghezza" />
</app-campo>
@if (errore(); as testo) {
  <p class="esito esito-errore" role="alert">{{ testo }}</p>
}
<div class="azioni">
  @if (daConfermare()) {
    <button
      class="pulsante pulsante-pericolo"
      type="button"
      [disabled]="inCorso()"
      (click)="storna()"
    >
      {{ 'gestionale.fatture.nota.conferma' | transloco }}
    </button>
    <button class="pulsante pulsante-fantasma" type="button" (click)="daConfermare.set(false)">
      {{ 'portale.documenti.annulla' | transloco }}
    </button>
  } @else {
    <button class="pulsante pulsante-secondario" type="button" (click)="daConfermare.set(true)">
      <app-icona nome="undo" />
      {{ 'gestionale.fatture.nota.storna' | transloco }}
    </button>
  }
</div>
