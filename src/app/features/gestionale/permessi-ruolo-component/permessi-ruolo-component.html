<form class="modulo-scheda" (submit)="$event.preventDefault(); salva()">
  <h3 class="titolo-scheda">{{ 'gestionale.ruoli.' + ruolo().codice | transloco }}</h3>
  @for (gruppo of moduli(); track gruppo.modulo) {
    <fieldset class="modulo-scheda">
      <legend>{{ 'gestionale.permessi.moduli.' + gruppo.modulo | transloco }}</legend>
      @for (permesso of gruppo.permessi; track permesso.codice) {
        <label class="spunta">
          <input
            #casella
            type="checkbox"
            [checked]="scelti().has(permesso.codice)"
            (change)="segna(permesso.codice, casella.checked)"
          />
          {{ 'gestionale.permessi.voci.' + permesso.codice | transloco }}
        </label>
      }
    </fieldset>
  }
  @if (errore(); as testo) {
    <p class="esito esito-errore" role="alert">{{ testo }}</p>
  }
  <div class="azioni">
    <button class="pulsante pulsante-primario" type="submit" [disabled]="inCorso()">
      {{ 'gestionale.permessi.salva' | transloco }}
    </button>
  </div>
</form>
