<header class="pagina-intestazione">
  <p class="occhiello">{{ 'menu.gruppi.direzione' | transloco }}</p>
  <h1>{{ 'gestionale.impostazioni.titolo' | transloco }}</h1>
  <p class="introduzione">{{ 'gestionale.impostazioni.introduzione' | transloco }}</p>
</header>

@if (elenco.error(); as errore) {
  <p class="esito esito-errore" role="alert">{{ errori.messaggio(errore) }}</p>
}
<div class="griglia-prenotazione" [attr.aria-busy]="elenco.isLoading()">
  @if (puoImmagini) {
    <app-galleria-media
      entita="logo"
      chiave="gestionale.impostazioni.logo"
      [media]="logo.hasValue() ? logo.value() : []"
      [descrizione]="'gestionale.impostazioni.logo.descrizione' | transloco"
      (cambiati)="logoCambiato()"
    />
    <app-galleria-media
      entita="home"
      chiave="gestionale.impostazioni.sfondo"
      [conVideo]="true"
      [media]="sfondo.hasValue() ? sfondo.value() : []"
      [descrizione]="'gestionale.impostazioni.sfondo.descrizione' | transloco"
      (cambiati)="sfondo.reload()"
    />
  }
  @for (gruppo of gruppi(); track gruppo.nome) {
    <app-gruppo-impostazioni
      [gruppo]="gruppo.nome"
      [voci]="gruppo.voci"
      (salvate)="aggiornaSito()"
    />
  }
</div>
