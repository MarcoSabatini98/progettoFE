<section class="scheda">
  <header class="intestazione">
    <h1>{{ 'reimposta.titolo' | transloco }}</h1>
    @if (token()) {
      <p class="introduzione">{{ 'reimposta.introduzione' | transloco }}</p>
    }
  </header>

  @if (token()) {
    <form [formGroup]="modulo" (ngSubmit)="invia()" novalidate>
      <app-campo
        [etichetta]="'reimposta.password' | transloco"
        [aiuto]="'reimposta.aiuto' | transloco: { minima: lunghezza.minima }"
        [errore]="errori.campo(modulo.controls.password)"
      >
        <input
          type="password"
          formControlName="password"
          autocomplete="new-password"
          [maxLength]="lunghezza.massima"
          required
        />
      </app-campo>

      <app-campo
        [etichetta]="'reimposta.conferma' | transloco"
        [errore]="errori.campo(modulo.controls.conferma)"
      >
        <input type="password" formControlName="conferma" autocomplete="new-password" required />
      </app-campo>

      @if (errore()) {
        <p class="esito esito-errore" role="alert">{{ errore() }}</p>
      }

      <button
        class="pulsante pulsante-primario pulsante-intero"
        type="submit"
        [disabled]="inCorso()"
      >
        {{ 'reimposta.salva' | transloco }}
      </button>
    </form>
  } @else {
    <p class="non-valido" role="alert">
      <app-icona nome="error" />
      {{ 'reimposta.linkNonValido' | transloco }}
    </p>
    <a class="pulsante pulsante-primario pulsante-intero" [routerLink]="percorsi.recuperoPassword">
      {{ 'reimposta.nuovoLink' | transloco }}
    </a>
  }

  <a class="collegamento" [routerLink]="percorsi.accesso">{{ 'recupero.torna' | transloco }}</a>
</section>
