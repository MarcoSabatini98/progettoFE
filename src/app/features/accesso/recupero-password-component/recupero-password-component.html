<section class="scheda">
  <header class="intestazione">
    <h1>{{ 'recupero.titolo' | transloco }}</h1>
    <p class="introduzione">{{ 'recupero.introduzione' | transloco }}</p>
  </header>

  @if (inviata()) {
    <p class="esito esito-inviata" role="status">{{ 'recupero.inviata' | transloco }}</p>
  } @else {
    <form [formGroup]="modulo" (ngSubmit)="invia()" novalidate>
      <app-campo
        [etichetta]="'recupero.email' | transloco"
        [errore]="errori.campo(modulo.controls.email)"
      >
        <input type="email" formControlName="email" autocomplete="email" required />
      </app-campo>

      @if (errore()) {
        <p class="esito esito-errore" role="alert">{{ errore() }}</p>
      }

      <button
        class="pulsante pulsante-primario pulsante-intero"
        type="submit"
        [disabled]="inCorso()"
      >
        {{ 'recupero.invia' | transloco }}
      </button>
    </form>
  }

  <a class="collegamento" [routerLink]="accesso">{{ 'recupero.torna' | transloco }}</a>
</section>
