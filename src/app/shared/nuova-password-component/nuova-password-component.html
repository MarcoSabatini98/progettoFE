<app-campo
  [etichetta]="'nuovaPassword.password' | transloco"
  [aiuto]="'nuovaPassword.aiuto' | transloco: { minima: lunghezza.minima }"
  [errore]="errori.campo(gruppo().controls.password)"
>
  <input
    type="password"
    [formControl]="gruppo().controls.password"
    autocomplete="new-password"
    [maxLength]="lunghezza.massima"
    required
  />
</app-campo>

<app-campo [etichetta]="'nuovaPassword.conferma' | transloco" [errore]="erroreConferma()">
  <input
    type="password"
    [formControl]="gruppo().controls.conferma"
    autocomplete="new-password"
    required
  />
</app-campo>
